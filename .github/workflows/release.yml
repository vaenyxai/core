name: Release

# Builds the downloads the website links to, and attaches them to a GitHub
# Release. Runs only when a version tag is pushed (or by hand), so it costs
# nothing day to day. Tags are pushed by scripts/Vaenyx-Release.ps1, which
# stamps the version and runs the checks locally first.
#
# The website's Download buttons point at
#   https://github.com/vaenyxai/core/releases/latest/download/vaenyx-setup.exe
#   https://github.com/vaenyxai/core/releases/latest/download/vaenyx-setup.zip
# which GitHub always resolves to the newest release. Publishing a release is
# therefore the only step needed to ship an update -- nothing to re-upload,
# nothing on the site to edit, and no way for the two to drift apart. The
# asset NAMES are load-bearing: the site expects exactly these.
#
# Windows runner on purpose: the packaged .cmd launchers must carry CRLF line
# endings, the installer is compiled with Inno Setup (Windows-only), and the
# packaging scripts are the same ones used locally
# (scripts/Vaenyx-Make-Release-Zip.ps1, scripts/installer/
# Vaenyx-Build-Installer.ps1), so what is tested is what ships.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Deliberately NOT cancel-in-progress: cancelling a release halfway can
  # leave a published Release missing its assets. One release at a time,
  # each runs to completion.
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A broken build must never become a download.
      - name: Run checks
        run: npm run check

      - name: Build the zip download
        shell: pwsh
        run: ./scripts/Vaenyx-Make-Release-Zip.ps1

      # Inno Setup is free; Chocolatey is preinstalled on the runner. The
      # Simplified Chinese translation is vendored in scripts/installer, so
      # the stock install is enough.
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer exe
        shell: pwsh
        run: ./scripts/installer/Vaenyx-Build-Installer.ps1

      # Prove the artefact is installable before anyone can download it:
      # extract the zip somewhere clean and run the real setup end to end,
      # with the elevated step skipped (a CI runner has no business
      # registering a boot task) on a port that cannot collide. This is the
      # direct-start path -- the same path a first install takes on a real
      # machine. Publishing is blocked until this passes.
      - name: Verify the download installs
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "vaenyx-release-check"
          Expand-Archive -Path "release/vaenyx-setup.zip" -DestinationPath $dest -Force

          # The zip's top level is a contract the install guides describe:
          # exactly the setup launcher, the read-me, and the app folder.
          $top = @(Get-ChildItem $dest | Sort-Object Name | ForEach-Object { $_.Name })
          $expected = @("Read-Me-First.txt", "Vaenyx", "Vaenyx-Setup.cmd")
          if (($top -join "|") -ne ($expected -join "|")) {
            throw "Unexpected zip top level: $($top -join ', ')"
          }

          $app = Join-Path $dest "Vaenyx"
          & "$app/scripts/Vaenyx-Setup.ps1" -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "setup self-test failed" }
          & "$app/scripts/Vaenyx-Setup.ps1" -SkipAutostart -NoBrowser -Port 3210
          if ($LASTEXITCODE -ne 0) { throw "setup failed on the packaged download" }
          $response = Invoke-WebRequest "http://127.0.0.1:3210/v1/system/status" -UseBasicParsing -TimeoutSec 20
          if ($response.StatusCode -ne 200) { throw "status endpoint answered $($response.StatusCode), not 200" }
          $status = $response.Content | ConvertFrom-Json
          if ($status.status -ne "ready") { throw "the installed instance never became ready" }
          $bootstrap = Invoke-RestMethod "http://127.0.0.1:3210/v1/bootstrap/status" -TimeoutSec 20
          if (-not $bootstrap.setupRequired) { throw "a fresh install should ask for owner setup" }
          Write-Host "Packaged download installs and boots clean."

      # The exe's payload is byte-for-byte the same staged tree the zip
      # carries (both come from Vaenyx-Stage-Payload.ps1). Sanity-check that
      # it exists and its published hash matches, then REALLY exercise it.
      - name: Verify the installer exe
        shell: pwsh
        run: |
          $exe = Get-Item "release/vaenyx-setup.exe"
          if ($exe.Length -lt 1MB) { throw "vaenyx-setup.exe is suspiciously small ($($exe.Length) bytes)" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $published = (Get-Content "release/vaenyx-setup.exe.sha256" -Raw).Split(" ")[0].Trim()
          if ($hash -ne $published) { throw "vaenyx-setup.exe.sha256 does not match the exe" }
          Write-Host "Installer exe present, $([math]::Round($exe.Length / 1MB, 2)) MB, hash verified."

      # The exe is then REALLY installed and REALLY uninstalled, silently — a
      # throwaway runner is exactly the right place to exercise the boot task
      # it registers. This is the uninstaller's gate: without it, "uninstall
      # works" would be a claim nobody had ever tested. Checked on the way in:
      # Add/Remove entry, autostart task, a server that actually answers.
      # Checked on the way out: entry and task gone, code folders gone, the
      # server stopped — and userdata KEPT, because the suppressed keep-data
      # question must default to keeping (a silent uninstall that deleted a
      # person's data by default would be a catastrophe shipped as a default).
      - name: Verify the exe installs and uninstalls
        shell: pwsh
        run: |
          $dir = "C:\VaenyxExeCheck"
          $innoLog = Join-Path $env:RUNNER_TEMP "vaenyx-install-inno.log"
          # The install's console output goes to ITS window, not this step's
          # log — but Setup.ps1 keeps a full transcript in userdata\logs\
          # setup.log and /LOG makes Inno write its own. On any failure both
          # tails are printed, so a red run says WHERE instead of just "red".
          function Show-InstallLogs {
            Write-Host "=== Inno log tail ==="
            if (Test-Path $innoLog) { Get-Content $innoLog -Tail 40 | Write-Host }
            Write-Host "=== setup.log tail ==="
            $setupLog = "$dir\userdata\logs\setup.log"
            if (Test-Path $setupLog) { Get-Content $setupLog -Tail 60 | Write-Host }
            Write-Host "=== processes still around ==="
            Get-Process | Where-Object { $_.ProcessName -match '^(vaenyx|node|npm|powershell|pwsh|cmd|schtasks|winget|msiexec)' } |
              Format-Table Id, ProcessName, StartTime -AutoSize | Out-String | Write-Host
          }
          $p = Start-Process -FilePath "release\vaenyx-setup.exe" `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir","/LOG=$innoLog" `
            -PassThru
          if (-not $p.WaitForExit(20 * 60 * 1000)) {
            Show-InstallLogs
            throw "silent install did not finish within 20 minutes"
          }
          if ($p.ExitCode -ne 0) { Show-InstallLogs; throw "silent install exited $($p.ExitCode)" }

          # A suppressed setup failure still exits 0, so the running server is
          # the real proof the install worked.
          $ready = $false
          foreach ($attempt in 1..40) {
            Start-Sleep -Seconds 3
            try {
              $status = Invoke-RestMethod "http://127.0.0.1:3000/v1/system/status" -TimeoutSec 5
              if ($status.status -eq "ready") { $ready = $true; break }
            } catch {}
          }
          if (-not $ready) { Show-InstallLogs; throw "the exe-installed instance never became ready on port 3000" }
          if (-not (Test-Path "$dir\unins000.exe")) { throw "unins000.exe missing after install" }
          $reg = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{19467537-246D-4970-9F8B-C6C03E2904D7}_is1",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\{19467537-246D-4970-9F8B-C6C03E2904D7}_is1"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $reg) { throw "no Add/Remove Programs entry after install" }
          schtasks /Query /TN "VaenyxAutostart" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "autostart task was not registered by the exe install" }
          Write-Host "Installed: server ready, Add/Remove entry present, autostart task present."

          # Seed a marker so "userdata kept" is proven on real content, not an
          # empty folder.
          New-Item -ItemType Directory -Force -Path "$dir\userdata\config" | Out-Null
          Set-Content -Path "$dir\userdata\config\keep-me.txt" -Value "still here"

          # The uninstaller relaunches itself from TEMP (as _iuXXXXX.tmp), so
          # neither the first process returning nor the Add/Remove entry
          # disappearing means it is DONE — the entry goes early, while the
          # DelTree of a built node_modules keeps running for minutes.
          # Completion is the relaunched process exiting.
          Start-Process -FilePath "$dir\unins000.exe" `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' | Out-Null
          Start-Sleep -Seconds 10
          $deadline = (Get-Date).AddMinutes(8)
          while ((Get-Date) -lt $deadline) {
            $running = @(Get-Process | Where-Object { $_.ProcessName -like '_iu*' -or $_.ProcessName -like 'unins*' }).Count
            if ($running -eq 0) { break }
            Start-Sleep -Seconds 5
          }
          if (@(Get-Process | Where-Object { $_.ProcessName -like '_iu*' -or $_.ProcessName -like 'unins*' }).Count -ne 0) {
            throw "the uninstaller was still running 8 minutes after launch"
          }
          if (Test-Path $reg) { throw "Add/Remove entry still present after uninstall" }

          schtasks /Query /TN "VaenyxAutostart" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "autostart task survived uninstall" }
          foreach ($folder in @("apps", "packages", "node_modules", "scripts")) {
            if (Test-Path "$dir\$folder") { throw "$folder\ survived uninstall" }
          }
          if (-not (Test-Path "$dir\userdata\config\keep-me.txt")) {
            throw "userdata was DELETED by a silent uninstall - the keep-data default is broken"
          }
          try {
            Invoke-RestMethod "http://127.0.0.1:3000/v1/system/status" -TimeoutSec 5 | Out-Null
            throw "the server is still answering after uninstall"
          } catch {
            if ($_.Exception.Message -eq "the server is still answering after uninstall") { throw }
          }
          Write-Host "Uninstalled: entry and task gone, code folders gone, server stopped, userdata kept."

      # Published with the GitHub CLI, which is preinstalled on the runner.
      # No third-party action gets write access to this repository's releases
      # - for a project whose whole promise is "you can audit what runs on
      # your machine", the supply chain of its own download matters.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Two downloads, same result -- pick one:

          **vaenyx-setup.exe** (recommended): a normal Windows installer.
          If Windows shows a blue box saying "Windows protected your PC",
          click **More info**, then **Run anyway** -- the download is new
          and not yet signed; nothing is wrong. The wizard asks where to
          install, sets everything up, and leaves a Vaenyx icon on the
          desktop.

          **vaenyx-setup.zip**: the same install without a wizard. Unzip
          it, read ``Read-Me-First.txt``, then double-click
          **Vaenyx-Setup.cmd**.

          Your notes, chats and files stay on that computer; what you send
          to a connected cloud model goes to that provider.

          Optional check: the SHA-256 of each download is in the matching
          ``.sha256`` file.

          ## Code signing policy

          Free code signing provided by [SignPath.io](https://signpath.io),
          certificate by [SignPath Foundation](https://signpath.org).

          **Roles:**
          - Committers and reviewers: [vaenyxai organisation members](https://github.com/orgs/vaenyxai/people)
          - Approvers: [vaenyxai organisation owners](https://github.com/orgs/vaenyxai/people?query=role%3Aowner)

          **Privacy policy:** Vaenyx runs on your own machine. It does not transfer
          any information to other networked systems unless specifically requested
          by the user or the person installing or operating it -- see
          [Privacy Policy](https://github.com/vaenyxai/core/blob/main/docs/legal/privacy-policy.md)
          for the full statement, including the third-party AI providers you may
          choose to connect.
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" `
            release/vaenyx-setup.exe `
            release/vaenyx-setup.exe.sha256 `
            release/vaenyx-setup.zip `
            release/vaenyx-setup.zip.sha256 `
            --title "Vaenyx $env:GITHUB_REF_NAME" `
            --notes-file "$notesFile" `
            --generate-notes

      - name: Keep the packages as build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: vaenyx-setup
          path: |
            release/vaenyx-setup.exe
            release/vaenyx-setup.exe.sha256
            release/vaenyx-setup.zip
            release/vaenyx-setup.zip.sha256
          retention-days: 14
